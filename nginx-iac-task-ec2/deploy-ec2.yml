---
- name: Deploy EC2 NGINX stack with Terraform + test endpoint + HA commands
  hosts: localhost
  gather_facts: no
  vars:
    tf_dir: "./terraform"   # path to EC2 Terraform configs
  tasks:

    - name: Terraform init
      community.general.terraform:
        project_path: "{{ tf_dir }}"
        state: present
        force_init: yes
        binary_path: /usr/local/bin/terraform

    - name: Terraform plan
      command: terraform plan -out=tfplan
      args:
        chdir: "{{ tf_dir }}"

    - name: Terraform apply
      command: terraform apply -auto-approve tfplan
      args:
        chdir: "{{ tf_dir }}"

    - name: Get ALB DNS from Terraform output
      command: terraform output -raw alb_dns_name
      args:
        chdir: "{{ tf_dir }}"
      register: alb_dns

    - name: Get ASG instance IDs from Terraform output (list)
      command: terraform output -json asg_instance_ids
      args:
        chdir: "{{ tf_dir }}"
      register: asg_instance_ids_json

    - name: Parse ASG instance IDs into list
      set_fact:
        asg_instance_ids: "{{ asg_instance_ids_json.stdout | from_json }}"

    - name: Wait 7 minutes for EC2 instances + ALB to stabilize
      ansible.builtin.pause:
        minutes: 7

    - name: Test /phrase endpoint
      ansible.builtin.shell: "curl -i http://{{ alb_dns.stdout }}/phrase"
      register: curl_output
      retries: 10
      delay: 15
      until: curl_output.rc == 0

    - name: Show test result
      debug:
        var: curl_output.stdout_lines

    - name: Show HA testing commands
      debug:
        msg: 
          - "✅ NGINX ALB setup complete as per assignment requirements."
          - ""
          - "ALB DNS: {{ alb_dns.stdout }}"
          - "EC2 instances: {{ asg_instance_ids }}"
          - ""
          - "### Test functionality:"
          - ""
          - "1. Test /phrase endpoint:"
          - "   curl -i http://{{ alb_dns.stdout }}/phrase"
          - ""
          - "2. Stop any two instances (simulate failure):"
          - "   aws ec2 stop-instances --instance-ids {{ asg_instance_ids[0] }} {{ asg_instance_ids[1] }}"
          - ""
          - "3. Test again:"
          - "   curl -i http://{{ alb_dns.stdout }}/phrase"
          - ""
          - "4. Restart the stopped instances:"
          - "   aws ec2 start-instances --instance-ids {{ asg_instance_ids[0] }} {{ asg_instance_ids[1] }}"